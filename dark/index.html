后 5 尺',年龄范围:[8,60],起名词根:['格','里','斯纳','克','扎','布','尼克','沃']},{id:'slime',名称:'史莱姆',层级:'下层',描述:'史莱姆是由魂能废液与地下霉气凝结而成的半智慧生命体，身躯晶莹软滑，颜色从乳白到幽蓝各异。他们几乎没有固定形态，能压扁身体钻过门缝，也能将四肢延伸成触手。史莱姆拥有超乎寻常的耐久力，毒素和极端温度对其效果甚微，但力气虚弱得可怜——单是托起一把铁锤便已是壮举。在迷宫下层，他们多以清洁工或排污疏导工的身份苟活。',属性加值:{体质:2,力量:-2},生命骰:6,速度:20,天生护甲:0,天赋:'流体渗透：可挤过宽度不小于 1 寸的缝隙，且不视为挤压状态',年龄范围:[1,100],起名词根:['咕','噗','嗯','啾','滋','噶','嘿','嘘']},{id:'illithid',名称:'灵吸怪',层级:'上层',描述:'灵吸怪是艾斯特拉大陆最令人闻风丧胆的上层魔物之一。其头部由四根粗壮触手构成，瞳孔银白如月，散发着压迫性的心灵辐射。他们以高等意识生物的脑髓为食，将奴役与操控视为最自然的权力关系。在影议会内部，灵吸怪占据着情报与审讯部门的核心职位，以精神能力监控整座迷宫城。被灵吸怪盯上的猎物，往往在开口求饶之前便已被读取了全部秘密。',属性加值:{智力:2,感知:1},生命骰:8,速度:30,天生护甲:0,天赋:'心灵感知：可感知 30 尺内有智力的生物的情绪状态，并获悉其大致意图',代价:Xl,年龄范围:[30,300],起名词根:['依尔','赛瑟','斯卡','温','洛斯','弗','赛尔','曼']},{id:'gargoyle',名称:'石像鬼',层级:'中层',描述:'石像鬼由古代建筑魂印催生，外形与城堡角楼上的石雕无异——棱角分明的翅膀、鳞状皮肤、嵌入岩石纹理的眼眸。他们天生适应迷宫城的建筑环境，喜欢蹲踞于高台暗处观察人群。石像鬼行动虽慢，却拥有极强的物理抗性，普通刀刃在其皮肤上只留浅痕。迷宫城的守卫队与搬运工会中均有大量石像鬼成员，他们沉默寡言，以勤恳著称。',属性加值:{体质:2,力量:1},生命骰:10,速度:25,天生护甲:3,天赋:'石化伪装：静止超过一轮时，自动对旁观者施加伪装为普通雕像的幻象效果',年龄范围:[50,800],起名词根:['嘎','洛克','斯通','格瑞','卡','图姆','沃','德']},{id:'kobold',名称:'狗头人',层级:'下层',描述:'狗头人是矮小的鳞皮族群，头颅似龙犬杂交，眼神狡黠而警觉。他们极善于构建陷阱与地下机关，迷宫城的诸多暗道与地雷阵均出自狗头人之手。尽管体型弱小，狗头人在工程设计与陷阱工艺上展现出惊人的创造力，乃至部分上层匠师也不得不聘用他们来处理精密机关。在下层区域，狗头人聚居于蜂巢状洞穴，以氏族为单位互相守望。',属性加值:{敏捷:1,智力:1},生命骰:6,速度:30,天生护甲:0,天赋:'陷阱本能：可在一小时内徒手布置一个简单机械陷阱（DC12），察觉已知类型的陷阱时获得优势',年龄范围:[6,120],起名词根:['克斯','纳','维克','斯卡','比克','祖','雷克','托']},{id:'ogre',名称:'食人魔',层级:'中层',描述:'食人魔是暗夜大迷宫中最令人望而生畏的体型庞大族群，身高可达三米有余，皮肤粗糙如树皮，肌肉如铁铸就。他们智慧有限，但对战斗的本能直觉令经验丰富的冒险者也不敢轻视。食人魔多受雇于竞技场或地下拳场，充当门卫或斗士。少数觉醒了些许智慧的食人魔会与其他种族建立原始意义上的同盟关系，成为小团队中不可或缺的冲锋利器。',属性加值:{力量:3,智力:-2},生命骰:12,速度:30,天生护甲:1,天赋:'震地冲撞：冲锋后的近战攻击额外附带推退效果，目标须通过 DC14 力量豁免否则后退 10 尺',年龄范围:[15,90],起名词根:['乌格','罗格','莫','哈克','达','布鲁','图格','克拉']},{id:'werewolf',名称:'狼人',层级:'上层',描述:'狼人是艾斯特拉最古老的感染型种族，魂能月光与野兽血脉的结合赋予他们双重形态。人形时他们风度翩翩或粗犷豪迈，狼形时则化为杀戮机器——嗅觉锐利到可以在百米外辨别猎物的恐惧气息。狼人在迷宫城中往往独来独往，或组成小型猎人小队从事赏金追逃业务，影议会对其既利用又忌惮，定期以猎杀令遏制其族群过度扩张。',属性加值:{力量:2,敏捷:2},生命骰:10,速度:40,天生护甲:1,天赋:'月血嗅觉：能追踪任何流血目标的气息轨迹，追踪判定自动成功（目标须在 24 小时内流过血）',代价:Xl,年龄范围:[16,150],起名词根:['卢','弗','雷','格里','哈','沃尔','斯卡','纳']},{id:'serpent',名称:'蛇人',层级:'中层',描述:'蛇人拥有人类上半身与蟒蛇下半身，鳞片依个体差异呈翡翠绿、深紫或砖红色。他们是艾斯特拉最具天赋的毒物学家与谈判者，语调低沉悦耳，擅长以措辞精准的话术迷惑对方。蛇人聚居于迷宫城中层的「蜕皮市集」，掌控着暗夜大迷宫近七成的毒素与解药贸易。与其他种族不同，蛇人视诺言为神圣契约，一旦出卖盟友便会在族群中永久蒙羞。',属性加值:{敏捷:2,智力:1},生命骰:8,速度:30,天生护甲:1,天赋:'毒牙注射：近战命中时可选择注入毒素，目标须通过 DC13 体质豁免否则中毒（每日一次）',年龄范围:[14,200],起名词根:['赛斯','纳加','斯希','维佩','科斯','塞尔','阿斯','卡']},{id:'cyclops',名称:'独眼巨人',层级:'上层',描述:'独眼巨人额间那只独眼并非生理缺陷，而是天生聚焦魂能的透镜——据说古代的独眼巨人曾以此独眼目睹命运洪流。如今的独眼巨人多为迷宫城的重型工匠或要塞守将，他们可以徒手撕裂铁栅栏，锻造出任何其他种族难以企及的重型武器。然而魂能聚焦带来的代价是视野受限，其立体感知远逊于双眼生物，因此在复杂地形中往往行动笨拙。',属性加值:{力量:3,体质:2},生命骰:12,速度:25,天生护甲:1,天赋:'魂能独视：每日一次，以行动聚焦独眼发射魂能射线（射程 60 尺，4d6 魂能伤害）',代价:Xl,年龄范围:[20,400],起名词根:['波吕','奥努','库克','格里','提斯','布鲁','洛克','托斯']},{id:'vampire',名称:'吸血鬼',层级:'上层',描述:'吸血鬼是魂能腐化的不死族，外表如同永恒青春的贵族，皮肤苍白如月石，瞳孔深红如凝血。他们在政治与社交场合如鱼得水，天生散发一种令人难以抗拒的邪魅气场。迷宫城上层的豪奢区域是吸血鬼的领地，他们把持着金融、奴隶拍卖和秘密信息网络。阳光与流动之水是其天敌；灵魂契约则是其保持权力的核心手段——每一个被吸血鬼效忠的存在都在不知不觉中出卖了部分灵魂。',属性加值:{敏捷:2,魅力:2},生命骰:8,速度:35,天生护甲:0,天赋:'魅惑凝视：以行动凝视一名可见的人型生物，目标须通过 DC14 感知豁免否则魅惑直至下一轮结束',代价:Xl,年龄范围:[18,2e3],起名词根:['弗拉','德拉','卡尔','伊格','莫尔','达尔','赛罗','诺斯']},{id:'minotaur',名称:'牛头人',层级:'中层',描述:'牛头人拥有人类躯干与公牛头颅，两侧牛角弯曲锋利，足以洞穿厚木门板。他们天生具备精准的方向感，即便在暗夜大迷宫最复杂的地下回廊中也绝不迷路。牛头人文化崇尚荣誉与直接，憎恶欺骗与迂回，这使他们在迷宫城的政治游戏中往往处于下风，却也让他们赢得了众多真诚同伴的信赖。迷宫城中层有一整条以牛头人雕像装饰的「牛骨大街」，曾是其族群的荣耀见证。',属性加值:{力量:2,体质:1},生命骰:10,速度:35,天生护甲:1,天赋:'迷宫直觉：永远知晓自己在任何建筑或地下结构中所处的大致方位，且追踪判定获得优势',年龄范围:[15,120],起名词根:['米诺','陶鲁','克里','布拉','拉洛','托','格尔','赫']},{id:'skeleton',名称:'骷髅',层级:'下层',描述:'骷髅是被魂能残留驱动的亡者遗骸，大多已失去生前记忆，仅保留了模糊的行为习惯与身份认知。他们不需要进食、呼吸或睡眠，只靠微量的环境魂能维持意识运转。在迷宫城，骷髅从事着最危险或最繁重的劳动——地下矿坑的矿工、处决场的刽子手、深层区域的探路者。部分骷髅在漫长岁月中重拾了自我意识，开始以个体身份而非「被驱役的亡者」去探索这个世界。',属性加值:{敏捷:1,体质:1},生命骰:8,速度:30,天生护甲:1,天赋:'不死躯体：免疫毒素、疾病和睡眠效果，但无法从休息中恢复生命值（须通过魂能修复）',年龄范围:[1,3e3],起名词根:['克拉','莫尔','哈','斯卡','多','里斯','格','奥']},{id:'ooze',名称:'泥怪',层级:'中层',描述:'泥怪是史莱姆族群在高浓度魂能环境中进化出的高等形态，体型更大，颜色更深，智慧也显著提升。他们的身躯可以分裂再融合，并在接触时溶解有机物质。泥怪极度内向，厌恶嘈杂的社交环境，往往独居于迷宫城中层阴暗的废弃廊道，以过往的有机废物为食。少数泥怪以「清洁承包商」身份出现在商业场合，凭借近乎完美的清洁能力收取高额报酬，但其散发的腐化气味令雇主敬而远之。',属性加值:{体质:3,魅力:-2},生命骰:10,速度:20,天生护甲:0,天赋:'腐蚀接触：近战徒手命中时额外造成 1d4 酸性伤害，且目标所持金属武器须通过 DC13 耐久豁免',年龄范围:[1,500],起名词根:['姆','噗','咕噜','嗞','嘛','布鲁','嗡','格里']},{id:'myconid',名称:'真菌人',层级:'下层',描述:'真菌人是由地下菌网生长出的植物型智慧生命，头顶菌盖颜色鲜艳如毒蘑菇，身躯由缠绕的菌丝束构成。他们以孢子为媒介进行「意识共享」交流，是天然的信息传递网络节点。在迷宫城下层，真菌人经营着一套隐秘的地下情报网，各类秘密谣言往往在孢子雾气中悄然流传。真菌人性情平和，鲜少主动挑衅，但当同族遭到威胁时，他们会联动整片菌落网络给予反击。',属性加值:{感知:2,体质:1},生命骰:8,速度:20,天生护甲:0,天赋:'孢子感知：可通过附近菌网感知 60 尺内任何与地面接触的生物的大致位置（即便在黑暗中）',年龄范围:[5,200],起名词根:['菌','孢','芽','霉','真','菇','丝','根']},{id:'drow',名称:'暗影精灵',层级:'中层',描述:'暗影精灵是被逐出地表的精灵后裔，在地下漫长的流亡岁月中皮肤转为乌炭或幽紫，眼瞳变为银白或深红。他们在艾斯特拉的地下政治中如鱼得水，以优雅外表掩盖深入骨髓的算计与野心。暗影精灵的魔法才能仍保留着祖先的血脉遗产，他们尤擅幽暗魔法与幻象术，在迷宫城中层的刺客行会与信息掮客行业中地位举足轻重。族群内部的权力纷争从未停歇，背叛与反目是家常便饭。',属性加值:{敏捷:2,魅力:1},生命骰:8,速度:30,天生护甲:0,天赋:'幽暗视界：在完全黑暗中视物如同昏暗光线，且对基于黑暗的魅惑与恐惧效果具有抗性',年龄范围:[18,750],起名词根:['赞纳','维','达尔','卡拉','赛尔','娜尔','里','诶尔']},{id:'ghost',名称:'幽灵',层级:'中层',描述:'幽灵是执念过深而无法消散的魂能残影，外形朦胧透明，在昏暗廊道中如同流动的寒雾。他们往往执着于生前某段未了的心结——一笔未收回的债、一个未被报复的仇人、一段被强行中断的使命。幽灵在迷宫城中扮演着奇特的角色：他们既是神秘情报的来源，也是令普通居民闻之色变的灵异威胁。部分幽灵已接受了自身的存在形态，以顾问、引路者或监察者的身份融入了迷宫城的日常秩序。',属性加值:{敏捷:2,感知:1},生命骰:6,速度:30,天生护甲:0,天赋:'虚体穿越：可用移动穿越实体墙壁（每轮最多 5 尺），但在物质世界中实施物理攻击时承受劣势',年龄范围:[1,1e3],起名词根:['幽','灵','魂','影','冥','虚','霭','魄']},{id:'arachne',名称:'蛛魔',层级:'上层',描述:'蛛魔拥有人类上半身与巨蛛下半身，是暗夜大迷宫上层最令探险者心生恐惧的猎手之一。她们（蛛魔绝大多数为雌性）的蜘蛛丝由魂能催化，韧性远超普通蛛网，足以束缚一头食人魔。蛛魔掌控着迷宫城上层「织网区」的奴隶贸易与情报黑市，以蛛网般的秘密关系网控制着数以百计的线人。蛛魔天性孤傲，将智力弱于自己的生物一律视为猎物或棋子，极少以平等姿态与人交谈。',属性加值:{敏捷:2,智力:2},生命骰:10,速度:35,天生护甲:2,天赋:'魂能蛛网：以行动喷射蛛网捆绑目标（射程 30 尺），目标须通过 DC15 敏捷豁免否则束缚（每日三次）',代价:Xl,年龄范围:[18,500],起名词根:['阿拉','卡尔','塞尔','维斯','纳克','斯拉','图尔','艾丝']},{id:'succubus',名称:'魅魔',层级:'中层',描述:'魅魔是以情感与欲望为食的半魔生灵，拥有近乎完美的外貌、收放自如的小巧翼膜与一条灵动的细长尾尖。他们能敏锐嗅出任何生物内心深处的渴望，并以言语、眼神与幻梦将其放大成致命的软肋。在迷宫城中层，魅魔垄断着欢愉沙龙与社交情报业——影议会的许多机密，都是在他们的丝绒软榻上被低声吐露的。魅魔并不嗜杀，对他们而言，让猎物心甘情愿地奉上一切才是真正的艺术。',属性加值:{魅力:2,敏捷:1},生命骰:8,速度:30,天生护甲:0,天赋:'摄心魅语：对情绪类（欺瞒/说服/表演）检定获得加值+2，且每日一次可重骰一次失败的魅力检定',年龄范围:[16,600],起名词根:['莉','丝','薇','娅','梦','茉','珞','妲']},{id:'custom',名称:'自定义种族',层级:'中层',描述:'来自艾斯特拉大陆深处的神秘血脉，其起源与特质由命运本身书写。无论是被遗忘的古代实验体、跨越位面的异界访客，还是某种罕见基因突变的结晶，这具躯体注定将走出一条前人未曾踏足的道路。',属性加值:{},生命骰:8,速度:30,天生护甲:0,天赋:'无限可能：由玩家与故事主持人共同协商决定天赋内容',年龄范围:[1,9999],起名词根:['自','定','义','名','字','词','根']}],Jl=[{id:'hunter',名称:'猎手',描述:'你在暗夜大迷宫幽深的廊道间以猎获为生，熟悉各类怪物的习性与弱点。无论是追踪逃奴的气味还是为客户捕捉活体标本，你都游刃有余。影议会持有的猎人执照是你行走灰色地带的护身符，亦是你与底层同族之间无形的阶级鸿沟。',技能熟练:['隐匿','生存'],工具熟练:'陷阱工具',装备包:['魂晶涂层捕兽夹','幽光追踪粉×3','兽皮斗篷','魂晶×10']},{id:'craftsman',名称:'工匠',描述:'你以双手为生，在迷宫城的锻炉与工坊间打磨出自己的一席之地。精灵腿骨制成的精雕刀、矮人皮鞣制的防火围裙——你懂得如何用最边缘化的材料创造最实用的器具。影议会的工匠公会为你提供庇护，但公会抽成也让你的收入永远只够维持温饱。',技能熟练:['调查','巧手'],工具熟练:'工匠工具',装备包:['精灵腿骨凿','矮人皮围裙','半身人骨锉','魂晶×15']},{id:'shaman',名称:'萨满',描述:'你是魂能与自然之间的沟通者，研习古老的草药炼制与灵界秘术。在迷宫城，萨满既被视为不可或缺的治愈者，也被迷信者看作灾祸的召唤人。你的草药包里装着来自地下菌林的奇异草木，每一株都有其独特的魂能共振频率，足以治愈普通疗法束手无策的灵魂创伤。',技能熟练:['奥秘','宗教'],工具熟练:'草药包',装备包:['地下菌林草药包','魂能共振骨铃','兽骨符文牌×6','魂晶×8']},{id:'guard',名称:'守卫',描述:'你曾是迷宫城某片区域的秩序维护者——无论是影议会的正式卫兵、商会雇佣的护卫，还是某个势力范围内的非法执法者。你的身躯在无数次巡逻与冲突中磨砺出了超乎常人的反应速度，而你对权力机构运作方式的了解，有时比对手的剑更为锋利。',技能熟练:['运动','察觉'],工具熟练:'重武器',装备包:['迷宫城守卫徽章（已损毁）','铁链手铐×2','骨哨','魂晶×12']},{id:'merchant',名称:'商人',描述:'在暗夜大迷宫，信息与货物一样是流通的商品，而你是这场永无止境交易中的老手。你知道哪些区域的魂晶最便宜、哪位买家出手最阔绰，也知道哪些话题绝对不能在某些摊位前开口。算盘拨动之间，你早已将对手的底牌算清。',技能熟练:['说服','欺瞒'],工具熟练:'算盘',装备包:['骨质算盘','防伪魂印印章','皮质账本','魂晶×20']},{id:'tamer',名称:'驯养员',描述:'你以驯化迷宫城中的野生或人工培育怪物为业，竞技场、豪门宠物铺和地下押运队都是你的客源。鞭子是你与野兽之间的语言，而那种无声建立起来的服从关系，也让你在与人类以外的生命打交道时远比同龄人从容。某些你驯养过的生物，至今仍在某个角落记得你的气味。',技能熟练:['驯兽','威吓'],工具熟练:'鞭子',装备包:['魂能强化鞭','安神魂晶嗅盐','兽皮绑缚套具','魂晶×10']},{id:'cook',名称:'厨师',描述:'在一个食材多为地下怪物与真菌的城市，能把它们做得可口是一门真正的手艺。你熟知地下各类植物的毒性与药性，也懂得如何用烹饪手法中和危险食材的副作用。迷宫城中的食物有时是信息的载体，有时是毒药的媒介——而你两者皆懂。',技能熟练:['巧手','自然'],工具熟练:'厨具',装备包:['骨柄剔肉刀×3','菌类识别手册（残页）','防腐香料包','魂晶×8']},{id:'councilor',名称:'议员',描述:'你曾在影议会的某个分支机构中任职，或作为地方区域的议事代表，或充当某位高层权贵的幕僚。文件、印章与程序是你的战场，你知道如何让一项不利政策胎死腹中，也知道如何让一份私人合同在官方认可的框架下悄然生效。如今你离开了那个位置，但那枚印章还在你手中。',技能熟练:['洞悉','说服'],工具熟练:'印章',装备包:['影议会旧式印章','烫金羊皮纸×5','密封蜡棒','魂晶×18']},{id:'custom',名称:'自定义出身',描述:'你的来路在官方档案中找不到对应分类——也许是某个已被抹去的古老职业，也许是某次意外经历塑造的特殊身份。无论如何，你独特的过去赋予了你独特的技能，而在暗夜大迷宫，独特往往意味着生存的筹码。',技能熟练:['察觉','调查'],工具熟练:'自选工具',装备包:['个人随身物品','魂晶×10']}],Ql=[{id:'illithid-merchant',名称:'灵吸怪大商人',描述:'你是暗夜大迷宫最令人闻风丧胆的贸易巨头之一。以精神能力为工具，你在谈判桌上读取对手的底线，在合同签署前便已掌握全部筹码。你的商行横跨中上层，涉及魂晶期货、禁忌知识典籍与高端奴隶拍卖。影议会对你的存在既需要又忌惮，而你的脑髓欲求从未随财富积累而减弱。',推荐种族:['illithid'],推荐出身:['merchant']},{id:'vampire-noble',名称:'吸血鬼贵族',描述:'你的家族在暗夜大迷宫上层已统治了数个世纪，宫殿式的地下宅邸、成打的魂能债务人、精心维护的社交情报网——这些是你的遗产，也是你的枷锁。如今某些变故迫使你亲自踏入险地，但你骨子里的贵族傲慢从未消散，即便面对死亡，你也会以优雅的姿态抗拒。',推荐种族:['vampire'],推荐出身:['councilor']},{id:'fallen-guard',名称:'堕落守卫',描述:'你曾是影议会精锐守卫团的一员，执行过无数次镇压、抓捕与秘密处决任务。那些肮脏的命令你照单全收，直到某次任务让你越过了自己内心最后的界限。如今你的徽章已被没收，旧日同僚将你列入追捕名单，而你所掌握的议会内部秘密，随时可能成为续命的筹码或致命的把柄。',推荐种族:['werewolf','minotaur','gargoyle'],推荐出身:['guard']},{id:'underground-shaman',名称:'地下萨满',描述:'你在迷宫城最深层的魂能污染区域修行，那里聚集了被议会遗弃的病患与怪物。你用草药和灵能为他们续命，也在与魂能异变的长期接触中改变了自身。你能感知旁人无法察觉的灵界裂隙，也背负着常人难以理解的精神重量。',推荐种族:['myconid','ghost','skeleton'],推荐出身:['shaman']},{id:'slave-hunter',名称:'奴隶猎手',描述:'你是影议会奴隶管理部门的外包执行人，专门追捕逃跑的奴隶并将其押解回拍卖所。你对暗夜大迷宫的地形了如指掌，也知道每个逃跑者可能选择的藏身之所。然而随着某次任务的失手，你开始质疑这条以他人自由换取金币的道路究竟通向何处。',推荐种族:['goblin','kobold','werewolf'],推荐出身:['hunter']},{id:'arachne-spymaster',名称:'蛛魔情报头目',描述:'你织就了暗夜大迷宫上层最密集的情报蛛网，每一条流言、每一桩交易都在你的感知之下颤动。买家、卖家、叛徒、卧底——你的档案室里存放着足以颠覆三个势力的秘密。如今某人动了你的网，而你必须亲自出手，因为只有你知道这张网真正的致命漏洞在哪里。',推荐种族:['arachne','drow'],推荐出身:['councilor','hunter']},{id:'street-craftsman',名称:'街头工匠',描述:'你在迷宫城下层的露天市集摆摊谋生，用捡来的骨料和废旧魂晶敲打出够用的器具。你的客户是社会最底层的哥布林、骷髅和史莱姆，他们付不起公会产品的价格，而你恰好填补了这片空白。你的手艺不够精细，但你的定价让每一个穷鬼都能买到活命的工具。',推荐种族:['goblin','kobold','skeleton'],推荐出身:['craftsman']},{id:'arena-champion',名称:'竞技场冠军',描述:'迷宫城的地下竞技场是最残酷也最公平的舞台——观众只在乎生死，不问血统。你从无名参赛者一路厮杀到冠军宝座，以血肉赢得了名声与自由。但竞技场主席台上那些押注你死亡的贵族从未放弃，他们无法容忍一个凭真本事胜出的平民永远占据聚光灯。',推荐种族:['ogre','cyclops','minotaur'],推荐出身:['guard','tamer']},{id:'fungal-network-spy',名称:'菌网暗探',描述:'你利用真菌人的孢子情报网络从事秘密信息中介业务，在各大势力之间低价收购、高价出售消息。你的身份在官方档案中几乎不存在，你的联络人从不知道彼此的真实姓名。这份职业给了你无与伦比的安全感，直到某条你不该触碰的信息出现在了你的孢子接收器里。',推荐种族:['myconid','ghost','drow'],推荐出身:['shaman','merchant']},{id:'custom',名称:'自定义背景',描述:'你的故事在现有的迷宫城档案中找不到对应分类。也许你来自大陆另一端的古老城邦，也许你的过去被影议会的魂能抹除器清洗过，也许你只是不愿被任何标签定义。无论如何，你站在了暗夜大迷宫的入口，带着只属于你自己的理由。',推荐种族:[],推荐出身:[]}],ec=[{id:'none',名称:'无特长',档位:'生存',描述:'你没有任何超出种族天赋的特殊能力，依靠本能与运气在暗夜大迷宫中跌跌撞撞地生存。这并不意味着你毫无价值——有时候，平凡的外表是最好的伪装。',玩法影响:'无额外机制，所有检定均按基础规则进行'},{id:'sensory-boost',名称:'感官强化',档位:'生存',描述:'长期在光线匮乏的迷宫环境中磨砺，你的感官已超越了同种族的正常水平。微弱的气流变化、遥远的脚步震动、空气中残存的魂能余热——这些信号在你的感知中如同白昼般清晰。',玩法影响:'察觉与生存检定获得加值+2，在黑暗或低光环境中不受劣势惩罚'},{id:'culinary-mastery',名称:'巧妙厨艺',档位:'生存',描述:'你掌握了一门将地下生物与真菌转化为实用食物的精妙技艺。你知道哪种毒蘑菇炖煮后可以安全食用，哪块怪物肉质最为滋养，也知道如何用最少的食材烹制出恢复魂能的补给餐。',玩法影响:'短休期间烹制的食物额外恢复 1 个生命骰的生命值，且可中和轻度毒素'},{id:'moderate-regeneration',名称:'中度自愈',档位:'生存',描述:'你的体质异常顽强，伤口在魂能的刺激下愈合得比普通生物快得多。这种能力并非来自魔法，而是你在无数次受伤与复原中逐渐觉醒的生理本能，如同一株在岩缝中顽强生长的地下菌类。',玩法影响:'每次短休可额外恢复等同于体质调整值的生命值（最低 1 点）'},{id:'veteran',名称:'百战老兵',档位:'精英',描述:'你在生死边缘徘徊的经历已将你打磨成一件精准的战斗工具。你能在瞬间判断战场局势，在混乱中找到最有利的站位，在敌人尚未出剑时便预判了其下一步动作。存活本身就是你最高的荣耀。',玩法影响:'先攻检定获得优势，且在第一轮战斗中的攻击检定获得加值+2'},{id:'mind-control',名称:'精神控制',档位:'精英',描述:'你掌握了初阶魂能精神干预术，能以意念渗透弱意志生物的思维，植入简单的行动指令或情绪暗示。这项能力的使用需要高度集中，且对目标造成的影响往往在数小时后消散。',玩法影响:'每日一次，以行动对一名智力 8 以下的生物施加魅惑效果，持续至场景结束'},{id:'telekinesis',名称:'念力',档位:'精英',描述:'你以魂能延伸出无形的精神触手，能在不动身体的情况下操作周围的物件。这并非搬运大型货物的蛮力手段，而是一种精密的远程操作技术——开锁、按钮、拾取落地的武器，皆在掌握之中。',玩法影响:'可在检定中远程操作物体，力量等效 8，有效范围 30 尺'},{id:'master-craftsman',名称:'能工巧匠',档位:'精英',描述:'你对制造与修复的理解已超越了普通工匠的技艺边界，进入了将材料性能发挥到极致的艺术层次。你制作的器具拥有超出规格的耐久度，而你的维修手法也能让一件看似报废的装备重新焕发生机。',玩法影响:'使用工匠工具时检定自动成功（DC14 以下），且制作物品耗时减半'},{id:'soul-energy-master',名称:'魂能大师',档位:'传奇',描述:'你触摸到了魂能运作的底层规律，能以意志直接操控环境中的魂能流向。这种能力在艾斯特拉大陆极为罕见，足以令影议会的高层元老侧目——也足以让所有的魂能猎手将你列为首要目标。',玩法影响:'每日三次，可将任意魂能检定的结果提升至满骰值，或将环境中的游离魂能转化为 2d10 点伤害'},{id:'mind-mastery',名称:'精神掌握',档位:'传奇',描述:'你的意识已形成了一座固若金汤的精神堡垒，任何试图侵入的外部意念都将在其壁垒前碰壁，并被反弹回发起者的心灵深处。与此同时，你能以精神波动影响大范围内所有生物的情绪基调。',玩法影响:'免疫所有精神控制与魅惑效果，且每日一次可对 30 尺范围内所有生物施加恐惧或平静效果'},{id:'high-regeneration',名称:'高度自愈',档位:'传奇',描述:'你的魂能与生命力已融为一体，创伤在你身上只是暂时的状态。断指可以在数小时内重生，中毒状态在短休后便会自动清除，甚至濒死的边缘对你而言也只是一次漫长的沉睡而已。',玩法影响:'每轮开始时自动恢复 2 点生命值，短休后清除所有疾病与毒素效果'},{id:'shadow-affinity',名称:'暗影亲和',档位:'传奇',描述:'你的魂能与迷宫深处的黑暗本源产生了共鸣，仿佛这座暗夜大迷宫本身就在庇护着你。你能在阴影间瞬息穿行，令影议会的侦察者在追踪时屡屡失去你的气息。据说只有极少数生来便与黑暗立下契约的存在，才能获得迷宫意志的真正认可。',玩法影响:'在昏暗或黑暗环境中可消耗一个反应动作瞬间位移至 60 尺内可见的阴影处；对影议会成员的魅力检定自动获得优势'},{id:'custom',名称:'自定义特长',档位:'生存',描述:'你拥有一种超出常规分类的特殊能
